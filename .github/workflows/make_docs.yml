name: Make Docs

on:
  pull_request:
    branches: ["master"]
  push:
    branches:
      - master
    tags: '*'
  workflow_dispatch:

jobs:
  make_docs:
    permissions:  # Explicitly grant necessary permissions
      actions: write
      contents: write
      statuses: write
    uses: ProjectTorreyPines/GitHubActionsWorkflows/.github/workflows/make_docs.yml@master
    with:
      use_FuseRegistry: false  # HelpPlots and Documenter are both in General
